{% extends "base.html" %}
{% block title %}Acces echipă{% endblock %}
{% block content %}

<div class="container narrow-page small-page">
  <form method="post" class="card login-card">
    <p class="eyebrow">Acces echipă</p>
    <h1>Administrare MobilaTa</h1>
    <p class="muted">Doar pentru echipă: gestionezi produsele, comenzile și utilizatorii. Clienții intră din butonul „Cont” de sus.</p>
    {% if error %}<p class="flash flash-error">{{ error }}</p>{% endif %}
    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
    <label for="username">Utilizator</label>
    <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Parolă</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit" class="btn btn-large btn-block">Intră</button>
  </form>
</div>

{% endblock %}
